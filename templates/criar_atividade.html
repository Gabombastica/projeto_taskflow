{% extends 'base.html' %}
{% block conteudo %}


<h1> Formulário de trabalho </h1>
<form action="{{url_for('criar_atividade')}}" method="post">

<label>
    Nome da Atividade:
    <input name="form_nome" type="text" placeholder="Digite o nome da atividade" required>
</label>
<br>
<br>

<label>
    Nome do Responsável:
    <input name="form_responsavel" type="text" placeholder="Digite o nome do responsável" required>
</label>
<br>
<br>

<label>
    Descrição da Atividade: <br>
    <textarea name="form_descricao" rows="10" cols="50" required> </textarea>
</label>
<br>
<br>

<label>
    Recursos que serão utilizados na Atividade: <br>
    <textarea name="form_recurso" rows="10" cols="30" required> </textarea>
</label>
<br>
<br>

<label>
    Data da Atividade Agendada: <br>
    <input name="form_data" type="date" required>
</label>
<br>
<br>

<label>
    Prioridade da Atividade: <br>
    <input name="form_prioridade" value="1" type="radio" required>
    Baixa
</label>

<label>
    <input name="form_prioridade" value="2" type="radio" required>
    Médio
</label>

<label>
    <input name="form_prioridade" value="3" type="radio" required>
    Alta
</label>
<br>
<br>

<label>
    Tipo da Atividade: <br>
    <input name="form_tipo" value="1" type="checkbox" >
    Palestra
</label>

<label>
    <input name="form_tipo" value="2" type="checkbox">
    Reunião
</label>

<label>
    <input name="form_tipo" value="3" type="checkbox">
    Jurídico
</label>

<label>
    <input name="form_tipo" value="4" type="checkbox">
    Lazer
</label>

<label>
    <input name="form_tipo" value="5" type="checkbox">
    Estudos
</label>

<label>
    <input name="form_tipo" value="6" type="checkbox">
    Limpeza
</label>

<label>
    <input name="form_tipo" value="7" type="checkbox">
    Autocuidado
</label>
<br>
<br>

<button type="submit" style="background-color: pink"> Enviar Formulário </button>
<button type="reset" style="background-color: pink"> Limpar Formulário </button>

</form>

{% endblock conteudo %}
