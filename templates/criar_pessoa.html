{% extends 'base.html' %}
{% block conteudo %}


<h1> Cadastro de Usuário </h1>
<form action="{{url_for('criar_pessoa')}}" method="post"> <br>

<label>
    Nome do Usuário:
    <input name="form_nome" type="text" placeholder="Digite o seu nome">
</label>
<br>
<br>

<label>
    E-mail: <br>
    <input name="form_email" placeholder="Digite seu e-mail" required>
</label>
<br>
<br>

<label>
    Senha: <br>
    <input name="form_email" placeholder="Digite sua senha" required>
</label>
<br>
<br>


<button type="submit" style="background-color: pink"> Criar Conta </button>
<button type="reset" style="background-color: pink"> Limpar Dados </button>

</form>

{% endblock conteudo %}
